name: Build Custom RTL8189FS for H3 4.9.170

on:
  workflow_dispatch: # 允許手動點擊觸發

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Toolchain and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi build-essential git bc bison flex libssl-dev

    - name: Clone RTL8189FS Source
      run: |
        git clone https://github.com -b rtl8189fs driver-src

    - name: Download Linux 4.9.170 Kernel Tree
      run: |
        # 抓取標準且穩定的 Linux 4.9 長期支援版核心樹進行簽名匹配
        git clone --depth 1 https://googlesource.com -b linux-4.9.y kernel-src

    - name: Inject User Module.symvers
      run: |
        cp Module.symvers kernel-src/
        cp Module.symvers driver-src/
        cd kernel-src
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- defconfig
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- modules_prepare

    - name: Compile the Driver Module
      run: |
        cd driver-src
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- KSRC=../kernel-src modules

    - name: Upload Compiled Driver (.ko)
      uses: actions/upload-artifact@v4
      with:
        name: Custom-8189fs-Driver
        path: driver-src/8189fs.ko
